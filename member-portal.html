<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GGNZ Membership Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
  :root{
    --teal-900:#0d332e; --teal-800:#123f38; --teal-700:#14493f; --teal-600:#19584b; --teal-500:#1c6354;
    --marigold-600:#c8891f; --marigold-500:#dfa53a; --marigold-300:#eec478; --marigold-100:#faecc9;
    --bg:#eef4f0; --card:#ffffff; --ink:#1b2b26; --muted:#66756e; --border:#d9e3dc;
    --plum:#7a2e46; --plum-bg:#f7e9ee; --sage:#3f7a52; --sage-bg:#e7f1e9; --amber:#95651a; --amber-bg:#faf0dc;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;}
  h1,h2,h3{font-family:'Newsreader',serif;}
  .scallop{height:13px;background: radial-gradient(circle at 10px 0, transparent 9px, var(--marigold-500) 9.5px) 0 -1px/20px 13px repeat-x;}

  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}
  @media (min-width:900px){ body{background:var(--teal-900);} .wrap{box-shadow:0 0 50px rgba(0,0,0,0.25);} }

  .hero{background:var(--teal-900);color:#fff;padding:28px 20px 20px;text-align:center;}
  .hero .org{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold-300);}
  .hero h1{margin:4px 0 2px;font-size:24px;}
  .hero p{color:#c3d6cc;font-size:13px;margin:0;}

  .content{padding:22px 18px 60px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .field input, .field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:6px;font-size:14.5px;font-family:inherit;background:var(--bg);}
  .field input:focus, .field select:focus{outline:2px solid var(--marigold-500);outline-offset:1px;}
  .hint{color:var(--muted);font-size:12.5px;margin:-8px 0 16px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--teal-800);color:#fff;border:none;padding:12px 18px;border-radius:6px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--teal-700);}
  .btn.gold{background:var(--marigold-500);color:var(--teal-900);}
  .btn.gold:hover{background:var(--marigold-300);}
  .btn.ghost{background:transparent;color:var(--teal-800);border:1px solid var(--border);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.55;cursor:default;}

  .error-msg{background:var(--plum-bg);color:var(--plum);border:1px solid #ecc9d3;padding:10px 12px;border-radius:6px;font-size:13.5px;margin-bottom:16px;}
  .success-msg{background:var(--sage-bg);color:var(--sage);border:1px solid #cfe4d4;padding:10px 12px;border-radius:6px;font-size:13.5px;margin-bottom:16px;}

  .member-card{background:var(--teal-900);color:#fff;border-radius:14px;padding:22px 20px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden;}
  .member-card .mc-org{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold-300);}
  .member-card .mc-name{font-size:21px;margin:4px 0 2px;font-family:'Newsreader',serif;}
  .member-card .mc-id{color:#c3d6cc;font-size:13px;letter-spacing:.04em;}
  .member-card canvas{background:#fff;padding:10px;border-radius:8px;margin:16px auto 6px;display:block;}
  .member-card .mc-note{color:#a9c2b6;font-size:11.5px;margin-top:6px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11.5px;font-weight:700;}
  .badge.ok{background:var(--sage-bg);color:var(--sage);}
  .badge.pending{background:var(--amber-bg);color:var(--amber);}
  .badge.bad{background:var(--plum-bg);color:var(--plum);}

  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:0 0 10px;}
  .family-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .family-row:last-child{border-bottom:none;}
  .family-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--marigold-500);}

  .event-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .event-card.selected{border-color:var(--marigold-500);background:var(--marigold-100);}
  .event-card .ev-name{font-weight:700;color:var(--teal-900);font-size:15px;}
  .event-card .ev-meta{color:var(--muted);font-size:12.5px;margin-top:2px;}

  .booking-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
  .booking-row:last-child{border-bottom:none;}
  .booking-row .b-name{font-weight:600;font-size:13.5px;}
  .booking-row .b-meta{color:var(--muted);font-size:12px;}

  .empty-state{text-align:center;padding:30px 20px;color:var(--muted);font-size:13.5px;}
  .link-btn{background:none;border:none;color:var(--teal-700);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;font-family:inherit;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============================================================
   CONFIG — same Apps Script /exec URL as the committee dashboard
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbzCZk7asDKyO9vV3jpu0wvOautx-2JbzNpfl4_mmY5ljBxyRUJOafd7eNjOK2vqpXnU/exec";

/**
 * Fill this in once you've registered your site at
 * https://www.google.com/recaptcha/admin (choose reCAPTCHA v2, "I'm not
 * a robot" checkbox). Use the SITE key here — the SECRET key goes in
 * Code.gs, never in this frontend file.
 */
const RECAPTCHA_SITE_KEY = "6LcJOH4tAAAAAF5U6RDAJI5vd5LbYPt8efzeE2kO";

let jsonpCounter = 0;
function jsonpRequest(params) {
  return new Promise((resolve, reject) => {
    const cbName = "ggnzPortalCb_" + (jsonpCounter++) + "_" + Date.now();
    const script = document.createElement("script");
    const cleanup = () => { delete window[cbName]; document.body.removeChild(script); };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const qs = Object.keys(params).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
    script.src = API_URL + "?callback=" + cbName + "&" + qs;
    script.onerror = () => { cleanup(); reject(new Error("Network error contacting the API")); };
    document.body.appendChild(script);
  });
}
async function api(action, params) {
  if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) {
    throw new Error("API not configured yet — the organizer needs to set API_URL in this file.");
  }
  const result = await jsonpRequest(Object.assign({ action }, params || {}));
  if (!result.ok) throw new Error(result.error || "Something went wrong");
  return result;
}

function StatusBadge({ status }) {
  const s = (status || "").toLowerCase();
  const cls = ["confirmed","paid","active"].includes(s) ? "ok" : s === "pending" ? "pending" : "bad";
  return <span className={"badge " + cls}>{status || "—"}</span>;
}
function formatDate(d) {
  if (!d) return "—";
  const parsed = new Date(d);
  if (isNaN(parsed)) return "—";
  return parsed.toLocaleDateString("en-NZ", { day:"numeric", month:"short", year:"numeric" });
}

/* ============================================================
   CAPTCHA WIDGET
   ============================================================ */
function CaptchaWidget({ onVerify, resetSignal }) {
  const containerRef = useRef(null);
  const widgetId = useRef(null);

  useEffect(() => {
    let cancelled = false;
    const tryRender = () => {
      if (cancelled) return;
      if (window.grecaptcha && window.grecaptcha.render && containerRef.current && widgetId.current === null) {
        widgetId.current = window.grecaptcha.render(containerRef.current, {
          sitekey: RECAPTCHA_SITE_KEY,
          callback: onVerify,
          "expired-callback": () => onVerify("")
        });
      } else if (!cancelled) {
        setTimeout(tryRender, 300);
      }
    };
    tryRender();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (resetSignal && window.grecaptcha && widgetId.current !== null) {
      window.grecaptcha.reset(widgetId.current);
    }
  }, [resetSignal]);

  if (!RECAPTCHA_SITE_KEY || RECAPTCHA_SITE_KEY.indexOf("PASTE_YOUR") === 0) {
    return <p className="hint" style={{color:"var(--plum)"}}>CAPTCHA not configured yet — set RECAPTCHA_SITE_KEY in this file.</p>;
  }
  return <div ref={containerRef} style={{margin:"6px 0 16px"}}></div>;
}

/* ============================================================
   LOOKUP SCREEN
   ============================================================ */
function LookupScreen({ onFound }) {
  const [query, setQuery] = useState("");
  const [captchaToken, setCaptchaToken] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [resetSignal, setResetSignal] = useState(0);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!captchaToken) { setError("Please complete the CAPTCHA."); return; }
    setLoading(true);
    try {
      const res = await api("memberLookup", { query, captcha: captchaToken });
      onFound(res.data, res.data.member.MemberID);
    } catch (err) {
      setError(err.message);
      setCaptchaToken("");
      setResetSignal(s => s + 1);
    } finally { setLoading(false); }
  };

  return (
    <div className="content">
      <div className="card">
        <h3 style={{marginTop:0}}>Find your membership</h3>
        {error && <div className="error-msg">{error}</div>}
        <form onSubmit={submit}>
          <div className="field">
            <label>Member ID or mobile number</label>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="e.g. GGNZ-0001 or 021 234 5678" required autoFocus />
          </div>
          <CaptchaWidget onVerify={setCaptchaToken} resetSignal={resetSignal} />
          <button className="btn gold btn-block" type="submit" disabled={loading}>
            {loading ? "Looking up…" : "Find my membership"}
          </button>
        </form>
      </div>
      <p style={{textAlign:"center",color:"var(--muted)",fontSize:12.5}}>
        Don't know your Member ID? Just use your mobile number instead.
      </p>
    </div>
  );
}

/* ============================================================
   QR CODE
   ============================================================ */
function MemberQR({ value }) {
  const [failed, setFailed] = useState(false);
  const src = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=10&data=" + encodeURIComponent(value);
  if (failed) {
    return (
      <div style={{width:168,height:168,margin:"16px auto 6px",background:"#fff",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",padding:10}}>
        <div style={{color:"var(--teal-900)",fontWeight:700,fontSize:13}}>QR unavailable</div>
        <div style={{color:"var(--muted)",fontSize:12,marginTop:4}}>Show Member ID instead:<br/><strong>{value}</strong></div>
      </div>
    );
  }
  return <img src={src} alt={"QR code for " + value} width="168" height="168" style={{background:"#fff",padding:10,borderRadius:8,margin:"16px auto 6px",display:"block"}} onError={()=>setFailed(true)} />;
}

/* ============================================================
   MEMBER HOME — card, RSVP, booking history
   ============================================================ */
function MemberHome({ data, memberId, onSignOut }) {
  const [tab, setTab] = useState("card"); // card | rsvp | bookings
  const { member, family } = data;

  return (
    <div className="content">
      <div className="member-card">
        <div className="mc-org">GGNZ Membership</div>
        <div className="mc-name">{member.Name}</div>
        <div className="mc-id">{member.MemberID}</div>
        <MemberQR value={member.MemberID} />
        <div className="mc-note">Show this at check-in</div>
      </div>

      <div className="card" style={{display:"flex",justifyContent:"space-around",padding:10,marginBottom:16}}>
        <button className="link-btn" style={tab==="card"?{color:"var(--marigold-600)"}:{}} onClick={()=>setTab("card")}>Details</button>
        <button className="link-btn" style={tab==="rsvp"?{color:"var(--marigold-600)"}:{}} onClick={()=>setTab("rsvp")}>RSVP</button>
        <button className="link-btn" style={tab==="bookings"?{color:"var(--marigold-600)"}:{}} onClick={()=>setTab("bookings")}>My bookings</button>
      </div>

      {tab === "card" && <DetailsTab member={member} family={family} />}
      {tab === "rsvp" && <RsvpTab member={member} family={family} />}
      {tab === "bookings" && <BookingsTab memberId={memberId} />}

      <button className="btn ghost btn-block" style={{marginTop:20}} onClick={onSignOut}>Look up someone else</button>
    </div>
  );
}

function DetailsTab({ member, family }) {
  return (
    <div className="card">
      <div className="section-label">Membership</div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
        <span>Dues status</span><StatusBadge status={member.DuesStatus} />
      </div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0"}}>
        <span>Meal plan</span><strong>{member.MealPlan || "—"}</strong>
      </div>
      {family.length > 0 && (
        <React.Fragment>
          <div className="section-label" style={{marginTop:18}}>Family members</div>
          {family.map(f => (
            <div key={f.MemberID} className="family-row">
              <div><strong>{f.Name}</strong><div style={{color:"var(--muted)",fontSize:12}}>{f.MemberID}</div></div>
            </div>
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

const MEAL_CHOICES = ["No Meal", "Standard", "Jain"];
const GUEST_TIERS = [
  { key: "Adult", label: "Adult (12+)", price: 20 },
  { key: "Child", label: "Child (5–12)", price: 10 },
  { key: "Under5", label: "Under 5", price: 0 }
];

function memberCharge(ageCategory, mealPlan, meal) {
  if (!meal || meal === "No Meal") return 0;
  const isPaidPlan = mealPlan === "Yearly" || mealPlan === "Half-Yearly";
  if (isPaidPlan) return 0;
  if (ageCategory === "Under 12Y") return 0;
  return 15;
}
function guestCharge(tierKey, meal) {
  if (!meal || meal === "No Meal") return 0;
  const tier = GUEST_TIERS.find(t => t.key === tierKey);
  return tier ? tier.price : 0;
}

function RsvpTab({ member, family }) {
  const [events, setEvents] = useState(null);
  const [error, setError] = useState("");
  const [success, setSuccess] = useState("");
  const [selectedEvent, setSelectedEvent] = useState(null);
  const [attending, setAttending] = useState({});   // MemberID -> bool
  const [mealChoice, setMealChoice] = useState({});  // MemberID -> meal string
  const [guests, setGuests] = useState([]);          // [{id, Name, Tier, Meal}]
  const [submitting, setSubmitting] = useState(false);
  const messageRef = useRef(null);

  useEffect(() => {
    if ((success || error) && messageRef.current) {
      messageRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }, [success, error]);

  const everyone = [{ MemberID: member.MemberID, Name: member.Name, AgeCategory: member.AgeCategory, MealPlan: member.MealPlan, MembershipStatus: member.MembershipStatus }, ...family];
  const isActive = p => !p.MembershipStatus || p.MembershipStatus === "Active";

  useEffect(() => {
    api("publicEvents", {}).then(r => setEvents(r.data)).catch(e => setError(e.message));
  }, []);

  const toggleAttending = (id, currentlyIn) => setAttending({ ...attending, [id]: !currentlyIn });
  const setMeal = (id, meal) => setMealChoice({ ...mealChoice, [id]: meal });

  const addGuest = () => setGuests([...guests, { id: "g" + Date.now() + Math.random(), Name: "", Tier: "Adult", Meal: "No Meal" }]);
  const updateGuest = (id, patch) => setGuests(guests.map(g => g.id === id ? { ...g, ...patch } : g));
  const removeGuest = (id) => setGuests(guests.filter(g => g.id !== id));

  const total = everyone.reduce((sum, p) => (isActive(p) && attending[p.MemberID] !== false) ? sum + memberCharge(p.AgeCategory, p.MealPlan, mealChoice[p.MemberID]) : sum, 0)
    + guests.reduce((sum, g) => sum + guestCharge(g.Tier, g.Meal), 0);

  const submit = async () => {
    setError(""); setSuccess("");
    const party = everyone.filter(p => isActive(p) && attending[p.MemberID] !== false);
    if (!selectedEvent) { setError("Choose an event first."); return; }
    if (party.length === 0 && guests.length === 0) { setError("Select at least one attendee, or add a guest."); return; }
    if (guests.some(g => !g.Name.trim())) { setError("Every guest needs a name."); return; }
    setSubmitting(true);
    try {
      for (const p of party) {
        await api("publicBooking", { record: JSON.stringify({
          EventID: selectedEvent.EventID, MemberID: p.MemberID, Name: p.Name,
          Party: 1, Meal: mealChoice[p.MemberID] || "No Meal"
        }) });
      }
      for (const g of guests) {
        await api("publicBooking", { record: JSON.stringify({
          EventID: selectedEvent.EventID, MemberID: "", Name: g.Name + " (Guest)",
          Party: 1, Meal: "Guest • " + g.Tier + " • " + (g.Meal || "No Meal")
        }) });
      }
      setSuccess("RSVP sent! The committee will confirm and follow up on payment.");
      setAttending({}); setMealChoice({}); setGuests([]); setSelectedEvent(null);
    } catch (e) { setError(e.message); }
    finally { setSubmitting(false); }
  };

  if (error && !events) return <div className="error-msg">{error}</div>;
  if (!events) return <div className="empty-state">Loading events…</div>;

  return (
    <div>
      <div ref={messageRef}>
        {success && <div className="success-msg">{success}</div>}
        {error && <div className="error-msg">{error}</div>}
      </div>

      <div className="section-label">Choose an event</div>
      {events.length === 0 ? (
        <div className="empty-state">No events are open for RSVP right now — check back soon.</div>
      ) : events.map(e => (
        <div key={e.EventID} className={"event-card" + (selectedEvent && selectedEvent.EventID===e.EventID ? " selected" : "")} onClick={()=>setSelectedEvent(e)}>
          <div className="ev-name">{e.Name}</div>
          <div className="ev-meta">{formatDate(e.Date)} · {e.Location || "Location TBC"}</div>
        </div>
      ))}

      {selectedEvent && (
        <React.Fragment>
          <div className="section-label" style={{marginTop:18}}>Members</div>
          {everyone.map(p => {
            const active = isActive(p);
            const isIn = active && attending[p.MemberID] !== false;
            const meal = mealChoice[p.MemberID] || "No Meal";
            const charge = isIn ? memberCharge(p.AgeCategory, p.MealPlan, meal) : 0;
            const isPaidPlan = p.MealPlan === "Yearly" || p.MealPlan === "Half-Yearly";

            if (!active) {
              return (
                <div className="card" key={p.MemberID} style={{marginBottom:10, opacity:0.7}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{fontWeight:700,fontFamily:"'Newsreader',serif",fontSize:16}}>{p.Name}</div>
                      <div style={{color:"var(--muted)",fontSize:12}}>{p.MemberID}</div>
                    </div>
                    <span className="badge bad">Membership inactive</span>
                  </div>
                  <p style={{fontSize:12.5,color:"var(--muted)",marginTop:8,marginBottom:0}}>
                    This membership is currently deactivated, so RSVPs can't be submitted. Contact the committee if this seems wrong.
                  </p>
                </div>
              );
            }

            return (
              <div className="card" key={p.MemberID} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:700,fontFamily:"'Newsreader',serif",fontSize:16}}>{p.Name}</div>
                    <div style={{color:"var(--muted)",fontSize:12}}>{p.MemberID} · {p.AgeCategory || "Age unknown"}</div>
                  </div>
                  <button
                    className="btn sm"
                    style={isIn ? {background:"var(--sage)"} : {background:"var(--border)",color:"var(--muted)"}}
                    onClick={()=>toggleAttending(p.MemberID, isIn)}
                  >
                    {isIn ? "Attending" : "Not Attending"}
                  </button>
                </div>
                <div style={{fontSize:12.5,color:"var(--muted)",marginTop:8}}>
                  Meal plan: <strong style={{color:"var(--ink)"}}>{p.MealPlan || "Not set"}</strong>
                  {isPaidPlan && <span style={{color:"var(--sage)"}}> (meals prepaid)</span>}
                </div>
                <div style={{marginTop:10, display:"flex", gap:8}}>
                  {MEAL_CHOICES.map(m => (
                    <button key={m} type="button"
                      className="btn sm"
                      style={meal===m ? {background:"var(--marigold-500)",color:"var(--teal-900)"} : {background:"#fff",color:"var(--ink)",border:"1px solid var(--border)"}}
                      onClick={()=>setMeal(p.MemberID, m)} disabled={!isIn}>
                      {m}
                    </button>
                  ))}
                </div>
                <div style={{marginTop:10,fontSize:13,fontWeight:700,color:"var(--teal-900)"}}>Charge: ${charge}</div>
              </div>
            );
          })}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:18,marginBottom:10}}>
            <div className="section-label" style={{margin:0}}>Guests (relatives only, non-members)</div>
            <button className="btn ghost sm" type="button" onClick={addGuest}>+ Add Guest</button>
          </div>
          <p style={{color:"var(--muted)",fontSize:12,marginTop:-4}}>Adult (12+) = $20 · Child (5–12) = $10 · Under 5 = Free — only charged if a meal is selected.</p>

          {guests.map(g => (
            <div className="card" key={g.id} style={{marginBottom:10}}>
              <div className="field" style={{marginBottom:8}}>
                <label>Guest name</label>
                <input value={g.Name} onChange={e=>updateGuest(g.id,{Name:e.target.value})} />
              </div>
              <div className="field" style={{marginBottom:8}}>
                <label>Age group</label>
                <select value={g.Tier} onChange={e=>updateGuest(g.id,{Tier:e.target.value})}>
                  {GUEST_TIERS.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                {MEAL_CHOICES.map(m => (
                  <button key={m} type="button" className="btn sm"
                    style={g.Meal===m ? {background:"var(--marigold-500)",color:"var(--teal-900)"} : {background:"#fff",color:"var(--ink)",border:"1px solid var(--border)"}}
                    onClick={()=>updateGuest(g.id,{Meal:m})}>
                    {m}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:13,fontWeight:700,color:"var(--teal-900)"}}>Charge: ${guestCharge(g.Tier, g.Meal)}</div>
                <button className="btn danger sm" type="button" onClick={()=>removeGuest(g.id)}>Remove</button>
              </div>
            </div>
          ))}

          <div className="card" style={{marginTop:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:700}}>Estimated total</div>
            <div style={{fontFamily:"'Newsreader',serif",fontSize:22,fontWeight:700,color:"var(--teal-900)"}}>${total}</div>
          </div>
          <p style={{color:"var(--muted)",fontSize:11.5,marginTop:6}}>This is an estimate — the committee confirms your booking and payment separately.</p>

          <button className="btn gold btn-block" style={{marginTop:6}} onClick={submit} disabled={submitting}>
            {submitting ? "Sending…" : "Submit RSVP"}
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

function BookingsTab({ memberId }) {
  const [bookings, setBookings] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    api("memberBookings", { memberId }).then(r => setBookings(r.data)).catch(e => setError(e.message));
  }, [memberId]);

  if (error) return <div className="error-msg">{error}</div>;
  if (!bookings) return <div className="empty-state">Loading…</div>;

  return (
    <div className="card">
      <div className="section-label">Your bookings</div>
      {bookings.length === 0 ? <div className="empty-state">No bookings yet.</div> : bookings.map((b,i) => (
        <div className="booking-row" key={i}>
          <div><div className="b-name">{b.Name}</div><div className="b-meta">{b.EventID} · {b.Meal || "No meal noted"}</div></div>
          <StatusBadge status={b.Status} />
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */
function App() {
  const [session, setSession] = useState(null); // { data, memberId }

  return (
    <div className="wrap">
      <div className="hero">
        <img src="ggnz-logo.png" alt="GGNZ logo" style={{width:76,height:76,margin:"0 auto 10px",display:"block"}} />
        <div className="org">Garvi Gujarat NZ</div>
        <h1>Membership Portal</h1>
        <p>Your card, your RSVPs, all in one place</p>
      </div>
      <div className="scallop"></div>
      {!session ? (
        <LookupScreen onFound={(data, memberId) => setSession({ data, memberId })} />
      ) : (
        <MemberHome data={session.data} memberId={session.memberId} onSignOut={() => setSession(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
