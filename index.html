<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GGNZ Committee</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
  :root{
    --teal-900:#0d332e;
    --teal-800:#123f38;
    --teal-700:#14493f;
    --teal-600:#19584b;
    --teal-500:#1c6354;
    --marigold-600:#c8891f;
    --marigold-500:#dfa53a;
    --marigold-300:#eec478;
    --marigold-100:#faecc9;
    --bg:#eef4f0;
    --card:#ffffff;
    --ink:#1b2b26;
    --muted:#66756e;
    --border:#d9e3dc;
    --plum:#7a2e46;
    --plum-bg:#f7e9ee;
    --sage:#3f7a52;
    --sage-bg:#e7f1e9;
    --amber:#95651a;
    --amber-bg:#faf0dc;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;}
  h1,h2,h3,.display{font-family:'Newsreader',serif;}

  /* Signature scallop motif */
  .scallop{
    height:13px;
    background: radial-gradient(circle at 10px 0, transparent 9px, var(--marigold-500) 9.5px) 0 -1px/20px 13px repeat-x;
  }
  .scallop.dark{
    background: radial-gradient(circle at 10px 0, transparent 9px, var(--teal-900) 9.5px) 0 -1px/20px 13px repeat-x;
  }

  /* --- Login --- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 15% 10%, var(--teal-600), var(--teal-900) 65%);padding:20px;}
  .login-card{background:var(--card);border-radius:6px;overflow:hidden;width:380px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.35);}
  .login-body{padding:34px 30px;}
  .login-body h1{font-size:27px;margin:0 0 4px;color:var(--teal-900);}
  .login-body p.sub{color:var(--muted);margin:0 0 24px;font-size:14px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:0.03em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .field input, .field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:inherit;background:var(--bg);}
  .field input:focus, .field select:focus{outline:2px solid var(--marigold-500);outline-offset:1px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--teal-800);color:#fff;border:none;padding:11px 18px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--teal-700);}
  .btn:focus-visible{outline:2px solid var(--marigold-500);outline-offset:2px;}
  .btn.gold{background:var(--marigold-500);color:var(--teal-900);}
  .btn.gold:hover{background:var(--marigold-300);}
  .btn.ghost{background:transparent;color:var(--teal-800);border:1px solid var(--border);}
  .btn.danger{background:var(--plum);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn-block{width:100%;}
  .error-msg{background:var(--plum-bg);color:var(--plum);border:1px solid #ecc9d3;padding:9px 12px;border-radius:4px;font-size:13px;margin-bottom:16px;}

  /* --- App shell --- */
  .app{display:flex;flex-direction:column;min-height:100vh;max-width:520px;margin:0 auto;background:var(--bg);position:relative;}
  @media (min-width:900px){ body{background:var(--teal-900);} .app{box-shadow:0 0 50px rgba(0,0,0,0.25);} }

  .topbar{background:var(--teal-900);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .topbar .tb-left{display:flex;align-items:center;gap:12px;}
  .icon-btn{background:none;border:none;color:#fff;font-size:19px;cursor:pointer;padding:4px 6px;border-radius:4px;line-height:1;}
  .icon-btn:hover{background:var(--teal-700);}
  .icon-btn:focus-visible{outline:2px solid var(--marigold-500);outline-offset:1px;}
  .topbar .brand{font-family:'Newsreader',serif;font-size:19px;letter-spacing:.02em;}
  .topbar .tb-right{display:flex;align-items:center;gap:4px;}
  .badge-dot{position:relative;}
  .badge-dot::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--marigold-500);border:1.5px solid var(--teal-900);}

  .content{padding:20px 16px 90px;flex:1;overflow-y:auto;}
  .page-title{margin:2px 0 18px;}
  .page-title h2{margin:0;font-size:21px;color:var(--teal-900);}
  .page-title .subtitle{color:var(--muted);font-size:13px;margin-top:2px;}

  /* Drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(13,51,46,0.45);z-index:40;}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:var(--teal-900);color:#e9f1ec;z-index:41;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,0.25);}
  .drawer-header{padding:20px 20px 14px;}
  .drawer-header .org{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--marigold-300);margin-bottom:2px;}
  .drawer-header h1{font-size:20px;margin:0;color:#fff;}
  .drawer-nav{flex:1;padding:10px 10px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:4px;color:#c3d6cc;cursor:pointer;font-size:14.5px;font-weight:600;margin-bottom:2px;transition:background .12s;}
  .nav-item:hover{background:var(--teal-700);color:#fff;}
  .nav-item.active{background:var(--teal-600);color:#fff;box-shadow:inset 3px 0 0 var(--marigold-500);}
  .nav-icon{width:20px;text-align:center;}
  .drawer-footer{padding:16px 20px;border-top:1px solid var(--teal-700);}
  .who{font-size:13px;color:#c3d6cc;margin-bottom:8px;}
  .who .role{display:inline-block;background:var(--teal-700);color:var(--marigold-300);font-size:10px;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;margin-left:6px;}

  /* Bottom tabs */
  .bottom-tabs{position:sticky;bottom:0;background:var(--teal-900);display:flex;justify-content:space-around;align-items:center;padding:9px 4px 12px;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,0.15);}
  .tab-item{background:none;border:none;color:#8bab9c;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;cursor:pointer;padding:4px 10px;border-radius:6px;font-family:inherit;font-weight:600;}
  .tab-item .t-icon{font-size:19px;}
  .tab-item.active{color:var(--marigold-300);}
  .tab-item:focus-visible{outline:2px solid var(--marigold-500);}

  /* Dashboard */
  .greeting h2{margin:0 0 2px;font-size:23px;color:var(--teal-900);}
  .greeting .date-line{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;margin-bottom:20px;}

  .stat-list{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px;}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .sr-left{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--ink);}
  .stat-row .sr-icon{font-size:18px;width:22px;text-align:center;}
  .stat-row .sr-value{font-family:'Newsreader',serif;font-size:19px;color:var(--teal-900);font-weight:700;}

  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:0 0 10px;}
  .qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
  .qa-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 12px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:8px;}
  .qa-btn:hover{border-color:var(--marigold-500);background:var(--marigold-100);}
  .qa-btn .qa-icon{font-size:20px;}
  .qa-btn .qa-label{font-size:13.5px;font-weight:700;color:var(--teal-900);}

  .event-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .event-card .ev-name{font-weight:700;color:var(--teal-900);font-size:14.5px;}
  .event-card .ev-meta{color:var(--muted);font-size:12.5px;margin-top:2px;}

  /* Generic cards & tables */
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:hover td{background:#f6f9f6;}
  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;}
  .badge.ok{background:var(--sage-bg);color:var(--sage);}
  .badge.pending{background:var(--amber-bg);color:var(--amber);}
  .badge.bad{background:var(--plum-bg);color:var(--plum);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .toolbar input[type=text], .toolbar input[type=search]{padding:9px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;flex:1;min-width:140px;}
  .list-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .list-card .scroll-x{overflow-x:auto;}

  .modal-overlay{position:fixed;inset:0;background:rgba(13,51,46,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:8px;width:440px;max-width:100%;max-height:88vh;overflow-y:auto;padding:24px;}
  .modal h3{margin:0 0 16px;color:var(--teal-900);}
  .modal .row-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .icon{font-size:32px;margin-bottom:10px;}

  .stub-panel{background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:40px 24px;text-align:center;color:var(--muted);}
  .stub-panel .icon{font-size:30px;margin-bottom:12px;}
  .stub-panel code{background:var(--bg);padding:2px 6px;border-radius:3px;font-size:12px;}

  .checkin-hero{background:var(--teal-900);color:#fff;border-radius:12px;padding:24px 20px;text-align:center;margin-bottom:18px;}
  .checkin-hero .icon{font-size:34px;margin-bottom:8px;}
  .checkin-hero p{color:#c3d6cc;font-size:13px;margin:4px 0 0;}

  a{color:var(--teal-700);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c7d6cc;border-radius:5px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ============================================================
   CONFIG — set this to your deployed Apps Script /exec URL
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbzCZk7asDKyO9vV3jpu0wvOautx-2JbzNpfl4_mmY5ljBxyRUJOafd7eNjOK2vqpXnU/exec";

/* ---------------- JSONP helper ---------------- */
let jsonpCounter = 0;
function jsonpRequest(params) {
  return new Promise((resolve, reject) => {
    const cbName = "ggnzCb_" + (jsonpCounter++) + "_" + Date.now();
    const script = document.createElement("script");
    const cleanup = () => { delete window[cbName]; document.body.removeChild(script); };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const qs = Object.keys(params).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
    script.src = API_URL + "?callback=" + cbName + "&" + qs;
    script.onerror = () => { cleanup(); reject(new Error("Network error contacting the API")); };
    document.body.appendChild(script);
  });
}

async function api(action, params, token) {
  if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) {
    throw new Error("API not configured yet — set API_URL at the top of the file.");
  }
  const result = await jsonpRequest(Object.assign({ action }, params || {}, token ? { token } : {}));
  if (!result.ok) throw new Error(result.error || "Request failed");
  return result;
}

/* ============================================================
   NAV CONFIG
   ============================================================ */
const NAV_ITEMS = [
  { key: "dashboard", label: "Dashboard", icon: "▦" },
  { key: "membership", label: "Membership", icon: "👥" },
  { key: "events", label: "Events", icon: "🎉" },
  { key: "bookings", label: "Bookings", icon: "📝" },
  { key: "payments", label: "Payments", icon: "💰" },
  { key: "checkin", label: "QR Check-In", icon: "📷" },
  { key: "reports", label: "Reports", icon: "📊" },
  { key: "communications", label: "Communications", icon: "📢" },
  { key: "volunteers", label: "Volunteers", icon: "🤝" },
  { key: "settings", label: "Settings", icon: "⚙" }
];

const BOTTOM_TABS = [
  { key: "dashboard", label: "Home", icon: "🏠" },
  { key: "membership", label: "Members", icon: "👥" },
  { key: "events", label: "Events", icon: "🎉" },
  { key: "checkin", label: "Check-in", icon: "📷" },
  { key: "settings", label: "Settings", icon: "⚙" }
];

/* ============================================================
   LOGIN
   ============================================================ */
function Login({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      const res = await api("login", { email, password });
      onLogin(res.token, res.user);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="scallop"></div>
        <div className="login-body">
          <img src="ggnz-logo.png" alt="GGNZ logo" style={{width:72,height:72,display:"block",margin:"0 auto 14px"}} />
          <h1 style={{textAlign:"center"}}>GGNZ Committee</h1>
          <p className="sub" style={{textAlign:"center"}}>Sign in with your committee account</p>
          {error && <div className="error-msg">{error}</div>}
          <form onSubmit={submit}>
            <div className="field">
              <label htmlFor="email">Email</label>
              <input id="email" type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus />
            </div>
            <div className="field">
              <label htmlFor="password">Password</label>
              <input id="password" type="password" value={password} onChange={e=>setPassword(e.target.value)} required />
            </div>
            <button className="btn gold btn-block" type="submit" disabled={loading}>
              {loading ? "Signing in…" : "Sign in"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SHELL
   ============================================================ */
function Shell({ user, token, onLogout }) {
  const [page, setPage] = useState("dashboard");
  const [drawerOpen, setDrawerOpen] = useState(false);
  const current = NAV_ITEMS.find(n => n.key === page);
  const go = (key) => { setPage(key); setDrawerOpen(false); };

  return (
    <div className="app">
      <div className="topbar">
        <div className="tb-left">
          <button className="icon-btn" aria-label="Open menu" onClick={()=>setDrawerOpen(true)}>&#9776;</button>
          <img src="ggnz-logo.png" alt="GGNZ logo" style={{width:26,height:26,borderRadius:"50%"}} />
          <span className="brand">GGNZ</span>
        </div>
        <div className="tb-right">
          <button className="icon-btn badge-dot" aria-label="Notifications" title="No new notifications" onClick={()=>alert("No new notifications")}>&#128276;</button>
          <button className="icon-btn" aria-label="Account" title={user.name} onClick={()=>{ if (confirm("Sign out of GGNZ Committee?")) onLogout(); }}>&#128100;</button>
        </div>
      </div>

      {drawerOpen && (
        <React.Fragment>
          <div className="drawer-overlay" onClick={()=>setDrawerOpen(false)}></div>
          <div className="drawer">
            <div className="drawer-header">
              <img src="ggnz-logo.png" alt="GGNZ logo" style={{width:44,height:44,marginBottom:8}} />
              <div className="org">GGNZ</div><h1>Committee</h1>
            </div>
            <div className="scallop"></div>
            <nav className="drawer-nav">
              {NAV_ITEMS.map(item => (
                <div key={item.key} className={"nav-item" + (page===item.key ? " active" : "")}
                     onClick={()=>go(item.key)} role="button" tabIndex={0}
                     onKeyDown={e=>{ if (e.key==="Enter") go(item.key); }}>
                  <span className="nav-icon">{item.icon}</span><span>{item.label}</span>
                </div>
              ))}
            </nav>
            <div className="drawer-footer">
              <div className="who">{user.name}<span className="role">{user.role}</span></div>
              <button className="btn ghost btn-block" onClick={onLogout}>Sign out</button>
            </div>
          </div>
        </React.Fragment>
      )}

      <div className="content">
        {page !== "dashboard" && (
          <div className="page-title"><h2>{current.label}</h2><div className="subtitle">{pageSubtitle(page)}</div></div>
        )}
        <Page page={page} token={token} user={user} onNavigate={go} />
      </div>

      <div className="bottom-tabs">
        {BOTTOM_TABS.map(tab => (
          <button key={tab.key} className={"tab-item" + (page===tab.key ? " active" : "")} onClick={()=>go(tab.key)}>
            <span className="t-icon">{tab.icon}</span><span>{tab.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function pageSubtitle(page) {
  const map = {
    membership: "Manage member records, dues and renewals",
    events: "Plan and manage upcoming GGNZ events",
    bookings: "Track RSVPs and event bookings",
    payments: "Record and review payments",
    checkin: "Check members in at the door",
    reports: "Trends across membership, events and finances",
    communications: "Email and announcements to members",
    volunteers: "Recruit and coordinate volunteers",
    settings: "Organization, users and preferences"
  };
  return map[page] || "";
}

function Page({ page, token, user, onNavigate }) {
  switch (page) {
    case "dashboard": return <Dashboard token={token} user={user} onNavigate={onNavigate} />;
    case "membership": return <Membership token={token} />;
    case "events": return <Events token={token} />;
    case "bookings": return <Bookings token={token} />;
    case "payments": return <Payments token={token} />;
    case "checkin": return <CheckIn token={token} />;
    case "reports": return <Reports token={token} />;
    case "communications": return <Stub icon="📢" label="Communications" note="Ready to wire up once your email API key is set — this will send announcements and RSVP confirmations to members." />;
    case "volunteers": return <Volunteers token={token} />;
    case "settings": return <Settings token={token} user={user} />;
    default: return null;
  }
}

function Stub({ icon, label, note }) {
  return (
    <div className="stub-panel">
      <div className="icon">{icon}</div>
      <h3 style={{margin:"0 0 8px", color:"var(--teal-900)"}}>{label} — coming soon</h3>
      <p style={{maxWidth:440, margin:"0 auto"}}>{note}</p>
    </div>
  );
}

/* ============================================================
   Shared bits
   ============================================================ */
function StatusBadge({ status }) {
  const s = (status || "").toLowerCase();
  const cls = ["confirmed","paid","active","planned"].includes(s) ? "ok" : s === "pending" ? "pending" : "bad";
  return <span className={"badge " + cls}>{status || "—"}</span>;
}
function MealBadge({ meal }) {
  const label = displayMeal(meal);
  let style = { background: "var(--border)", color: "var(--muted)" }; // No Meal / unset — grey
  if (label === "Standard") style = { background: "var(--marigold-100)", color: "var(--marigold-600)" }; // orange
  else if (label === "Jain") style = { background: "var(--sage-bg)", color: "var(--sage)" }; // green
  return <span className="badge" style={style}>{label}</span>;
}
function EmptyRow({ text }) { return <div className="empty-state"><div className="icon">—</div>{text}</div>; }
function LoadingPanel() { return <div className="empty-state">Loading…</div>; }
function ApiErrorPanel({ message }) {
  return (
    <div className="card" style={{borderColor:"var(--plum)"}}>
      <strong style={{color:"var(--plum)"}}>Couldn't load data:</strong> {message}
      {message.indexOf("API not configured") !== -1 && (
        <p style={{marginTop:8, color:"var(--muted)"}}>Set <code>API_URL</code> at the top of this file to your Apps Script web app URL.</p>
      )}
    </div>
  );
}
function formatDate(d) {
  if (!d) return "—";
  const parsed = new Date(d);
  if (isNaN(parsed)) return "—";
  return parsed.toLocaleDateString("en-NZ", { day:"numeric", month:"short", year:"numeric" });
}

/**
 * Guest bookings store Meal as "Guest • Adult • Standard" so the backend
 * can compute the correct charge — but that's redundant to show in a
 * table where the Name column already says "(Guest)". This just shows
 * the actual meal choice.
 */
function displayMeal(meal) {
  if (!meal) return "—";
  if (meal.indexOf("Guest") === 0) {
    const parts = meal.split("•").map(s => s.trim());
    return parts[parts.length - 1] || meal;
  }
  return meal;
}

function greetingFor(hour) {
  if (hour < 12) return "Good Morning";
  if (hour < 18) return "Good Afternoon";
  return "Good Evening";
}

function Membership({ token }) {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState("");
  const [search, setSearch] = useState("");
  const [editing, setEditing] = useState(null);

  const load = useCallback(() => {
    api("listMembers", {}, token).then(r => setRows(r.data)).catch(e => setError(e.message));
  }, [token]);
  useEffect(load, [load]);

  const filtered = useMemo(() => {
    if (!rows) return [];
    const q = search.toLowerCase();
    return rows.filter(r => (r.Name||"").toLowerCase().includes(q) || (r.MemberID||"").toLowerCase().includes(q) || (r.Email||"").toLowerCase().includes(q));
  }, [rows, search]);

  const save = async (form, familyMembers) => {
    const primary = await api("saveMember", { record: JSON.stringify(form) }, token);
    const primaryId = primary.data.MemberID;
    for (const fam of familyMembers) {
      if (!fam.Name.trim()) continue;
      await api("saveMember", { record: JSON.stringify({
        Name: fam.Name, DOB: fam.DOB, Email: fam.Email, Phone: fam.Phone,
        FamilyGroup: primaryId, MealPlan: form.MealPlan,
        MealPlanStartDate: form.MealPlanStartDate, MealPlanEndDate: form.MealPlanEndDate,
        MembershipStatus: form.MembershipStatus
      }) }, token);
    }
    setEditing(null);
    load();
  };
  const remove = async (id) => { if (!confirm("Remove this member?")) return; await api("deleteMember", { id }, token); load(); };

  if (error) return <ApiErrorPanel message={error} />;
  if (!rows) return <LoadingPanel />;

  return (
    <div>
      <div className="toolbar">
        <input type="search" placeholder="Search name, ID or email…" value={search} onChange={e=>setSearch(e.target.value)} />
        <button className="btn gold" onClick={()=>setEditing({})}>+ Add member</button>
      </div>
      <div className="list-card"><div className="scroll-x">
        {filtered.length === 0 ? <EmptyRow text="No members found" /> : (
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>DOB</th><th>Contact</th><th>Meal plan</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {filtered.map(m => {
                const dependents = rows.filter(r => r.FamilyGroup === m.MemberID);
                return (
                  <tr key={m.MemberID}>
                    <td>{m.MemberID}</td>
                    <td>
                      {m.Name}
                      {m.FamilyGroup && <div style={{color:"var(--muted)",fontSize:11.5}}>Family of {m.FamilyGroup}</div>}
                      {!m.FamilyGroup && dependents.length > 0 && <div style={{color:"var(--muted)",fontSize:11.5}}>+{dependents.length} family member{dependents.length===1?"":"s"}</div>}
                    </td>
                    <td>{formatDate(m.DOB)}</td>
                    <td>{m.Email}<br/><span style={{color:"var(--muted)",fontSize:12}}>{m.Phone}</span></td>
                    <td>{m.MealPlan || "—"}</td>
                    <td><StatusBadge status={m.MembershipStatus || "Active"} /></td>
                    <td style={{whiteSpace:"nowrap"}}>
                      <button className="btn ghost sm" style={{marginRight:6}} onClick={()=>setEditing(m)}>Edit</button>
                      <button className="btn danger sm" onClick={()=>remove(m.MemberID)}>Remove</button>
                    </td>

                );

          </table>
        )}
      </div></div>
      {editing !== null && <MemberModal record={editing} onClose={()=>setEditing(null)} onSave={save} />}

  );
}

   PAYMENTS
   ============================================================ */
function Payments({ token }) {
  const [bookings, setBookings] = useState(null);
  const [payments, setPayments] = useState(null);
  const [error, setError] = useState("");
  const [adding, setAdding] = useState(false);
  const [confirming, setConfirming] = useState(null); // { booking, groupSize }

  const load = useCallback(() => {
    Promise.all([
      api("listBookings", {}, token),
      api("listPayments", {}, token)
    ]).then(([b, p]) => { setBookings(b.data); setPayments(p.data); })
      .catch(e => setError(e.message));
  }, [token]);
  useEffect(load, [load]);

  const savePayment = async (record) => { await api("savePayment", { record: JSON.stringify(record) }, token); setAdding(false); load(); };
  const confirmPayment = async (method) => {
    try {
      await api("markBookingPaid", { id: confirming.booking.BookingID, method }, token);
      setConfirming(null);
      load();
    } catch (e) { alert(e.message); }
  };

  if (error) return <ApiErrorPanel message={error} />;
  if (!bookings || !payments) return <LoadingPanel />;

  const awaiting = bookings.filter(b => (b.PaymentStatus || "Pending") !== "Paid");
  // Group by who did the booking, per event — a family RSVPs and pays together.
  // Bookings without a BookedBy (e.g. added directly by the committee) are their own group.
  const groupKey = b => b.EventID + "::" + (b.BookedBy || b.MemberID || b.BookingID);
  const groupSizes = {};
  awaiting.forEach(b => { const k = groupKey(b); groupSizes[k] = (groupSizes[k] || 0) + 1; });
  const isBooker = b => !b.BookedBy || String(b.BookedBy) === String(b.MemberID);

  const total = payments.reduce((s,p)=> s + (parseFloat(p.Amount)||0), 0);

  return (
    <div>
      <div className="section-label" style={{marginTop:0}}>Awaiting payment</div>
      <p style={{color:"var(--muted)",fontSize:12.5,marginTop:-6,marginBottom:14}}>
        Families RSVP and pay together — Mark Paid appears once per booking, on whoever submitted it, and confirms everyone in that group at once.
      </p>
      <div className="list-card" style={{marginBottom:22}}><div className="scroll-x">
        {awaiting.length === 0 ? <EmptyRow text="Nothing awaiting payment" /> : (
          <table>
            <thead><tr><th>Name</th><th>Event</th><th>Meal</th><th></th></tr></thead>
            <tbody>
              {awaiting.map(b => {
                const size = groupSizes[groupKey(b)] || 1;
                const showButton = isBooker(b);
                return (
                  <tr key={b.BookingID}>
                    <td>{b.Name}{!showButton && <span style={{color:"var(--muted)",fontSize:11.5}}> (part of group)</span>}</td>
                    <td>{b.EventID}</td><td>{displayMeal(b.Meal)}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {showButton && (
                        <button className="btn gold sm" onClick={()=>setConfirming({ booking: b, groupSize: size })}>
                          Mark Paid{size > 1 ? " (" + size + ")" : ""}
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div></div>

      <div className="toolbar">
        <div className="section-label" style={{margin:0}}>Payment history · {payments.length} payment{payments.length===1?"":"s"} · ${total.toLocaleString()} total</div>
        <button className="btn gold" onClick={()=>setAdding(true)}>+ Record payment</button>
      </div>
      <div className="list-card"><div className="scroll-x">
        {payments.length === 0 ? <EmptyRow text="No payments yet" /> : (
          <table>
            <thead><tr><th>Date</th><th>Name</th><th>Amount</th><th>Method</th><th>For</th><th>Status</th></tr></thead>
            <tbody>
              {payments.slice().reverse().map((p,i) => (
                <tr key={i}>
                  <td>{formatDate(p.Date)}</td><td>{p.Name}</td><td>${p.Amount}</td><td>{p.Method}</td><td>{p.For}</td>
                  <td><StatusBadge status={p.Status} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div></div>
      {adding && <PaymentModal onClose={()=>setAdding(false)} onSave={savePayment} />}
      {confirming && <ConfirmPaymentModal booking={confirming.booking} groupSize={confirming.groupSize} onClose={()=>setConfirming(null)} onConfirm={confirmPayment} />}
    </div>
  );
}

function ConfirmPaymentModal({ booking, groupSize, onClose, onConfirm }) {
  const [method, setMethod] = useState("Cash");
  const [submitting, setSubmitting] = useState(false);
  const submit = async () => { setSubmitting(true); await onConfirm(method); setSubmitting(false); };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Confirm payment</h3>
        <p style={{color:"var(--muted)",fontSize:13.5,marginTop:-8}}>

          ) : (

/* ============================================================
   CHECK-IN — search + manual check-in, camera scan where supported
   ============================================================ */
function CheckIn({ token }) {
  const [events, setEvents] = useState(null);
  const [eventId, setEventId] = useState("");
  const [bookings, setBookings] = useState([]);
  const [query, setQuery] = useState("");
  const [group, setGroup] = useState(null); // array of bookings in the selected group
  const [recent, setRecent] = useState([]);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [scanning, setScanning] = useState(false);
  const [checkingIn, setCheckingIn] = useState(false);
  const [bookingsLoaded, setBookingsLoaded] = useState(false);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);

  useEffect(() => {
    api("listEvents", {}, token).then(r => setEvents(r.data)).catch(e => setError(e.message));
  }, [token]);

  const loadRecent = useCallback(() => {
    if (!eventId) { setRecent([]); return; }
    api("listCheckins", {}, token).then(r => setRecent(r.data.filter(c => String(c.EventID) === String(eventId)).slice(-8).reverse())).catch(()=>{});
  }, [eventId, token]);
  useEffect(loadRecent, [loadRecent]);

  useEffect(() => {
    setGroup(null); setQuery(""); setError(""); setNotice(""); setBookingsLoaded(false);
    if (!eventId) { setBookings([]); return; }
    api("listBookings", {}, token).then(r => {
      setBookings(r.data.filter(b => String(b.EventID) === String(eventId) && b.Status !== "Cancelled"));
      setBookingsLoaded(true);
    }).catch(e => { setError(e.message); setBookingsLoaded(true); });
  }, [eventId, token]);

  const groupKey = b => b.BookedBy || b.MemberID || b.BookingID;

  const selectGroup = (booking) => {
    const key = groupKey(booking);
    const members = bookings.filter(b => groupKey(b) === key);
    setGroup(members);
    setQuery(""); setError(""); setNotice("");
  };

  const matches = useMemo(() => {
    if (!query.trim() || !bookings.length) return [];
    const q = query.trim().toLowerCase();
    return bookings.filter(b => (b.Name||"").toLowerCase().includes(q) || (b.MemberID||"").toLowerCase().includes(q));
  }, [query, bookings]);

  const checkInGroupNow = async () => {
    if (!group || !group.length) return;
    setCheckingIn(true); setError(""); setNotice("");
    try {
      const created = await api("checkInGroup", { eventId, bookingIds: JSON.stringify(group.map(b => b.BookingID)) }, token);
      const already = group.length - created.data.length;
      setNotice(created.data.length + " checked in" + (already > 0 ? ` (${already} already checked in)` : ""));
      setGroup(null);
      loadRecent();
    } catch (e) { setError(e.message); }
    finally { setCheckingIn(false); }
  };

  const handleScanned = async (value) => {
    setError(""); setNotice("");
    try {
      const res = await api("checkInLookup", { eventId, memberId: value }, token);
      setGroup(res.data);
      setQuery("");
    } catch (e) { setError(e.message); }
  };

  const startScan = async () => {
    setError("");
    if (!eventId) { setError("Choose an event first."); return; }
    if (!window.jsQR) { setError("QR scanner didn't load — check your internet connection and try again, or search manually instead."); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setError("This browser doesn't expose camera access here (navigator.mediaDevices is missing) — try opening this page directly in Safari or Chrome rather than an in-app browser, or search manually instead.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      streamRef.current = stream;
      videoRef.current.srcObject = stream;
      await videoRef.current.play();
      setScanning(true);
      const loop = () => {
        if (!streamRef.current || !videoRef.current) return;
        const video = videoRef.current;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const canvas = canvasRef.current;
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imageData.data, imageData.width, imageData.height);
          if (code && code.data) { stopScan(); handleScanned(code.data); return; }
        }
        requestAnimationFrame(loop);
      };
      loop();
    } catch (e) {
      const name = e && e.name ? e.name : "Error";
      const hint = name === "NotAllowedError"
        ? "Camera permission was denied — check Settings → Safari → Camera (or the site's permissions) and allow access, then reload."
        : name === "NotFoundError"
        ? "No camera was found on this device."
        : name === "NotReadableError"
        ? "Another app may already be using the camera — close it and try again."
        : "Check camera permissions for this site, or search manually instead.";
      setError("Couldn't access the camera (" + name + "). " + hint);
    }
  };

  const stopScan = () => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    setScanning(false);
  };

  useEffect(() => () => stopScan(), []);

  return (
    <div>
      <div className="checkin-hero">
        <div className="icon">📷</div>
        <h3 style={{margin:0}}>Check members in</h3>
        <p>Scan a QR code or search by name / Member ID</p>
      </div>

      <div className="field">
        <label>Event</label>
        <select value={eventId} onChange={e=>setEventId(e.target.value)}>
          <option value="">Choose an event…</option>
          {(events||[]).map(e => <option key={e.EventID} value={e.EventID}>{e.Name} ({e.EventID})</option>)}
        </select>
      </div>

      {!eventId && <p style={{color:"var(--muted)",fontSize:13}}>Pick an event above to start checking people in.</p>}

      {eventId && (
        <React.Fragment>
          {error && <div className="error-msg">{error}</div>}
          {notice && <div className="success-msg">{notice}</div>}

          {!scanning && (
            <button className="btn gold btn-block" style={{marginBottom:16}} onClick={startScan} disabled={!bookingsLoaded}>
              {bookingsLoaded ? "📷 Start camera scan" : "Loading bookings\u2026"}
            </button>
          )}
          <div style={{marginBottom: scanning ? 16 : 0, display: scanning ? "block" : "none"}}>
            <video ref={videoRef} style={{width:"100%",borderRadius:10,background:"#000"}} muted playsInline></video>
            <button className="btn ghost btn-block" style={{marginTop:8}} onClick={stopScan}>Stop scanning</button>
          </div>
          <canvas ref={canvasRef} style={{display:"none"}}></canvas>

          <div className="field">
            <label>Search by name or Member ID</label>
            <input type="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="e.g. GGNZ-0001 or Priya" disabled={!bookingsLoaded} />
          </div>

          {matches.length > 0 && !group && (
            <div className="list-card" style={{marginBottom:20}}>
              <table>
                <tbody>
                  {matches.map(b => (
                    <tr key={b.BookingID}>
                      <td>{b.Name}<br/><span style={{color:"var(--muted)",fontSize:12}}>{b.MemberID || "Guest"}</span></td>
                      <td style={{textAlign:"right"}}><button className="btn gold sm" onClick={()=>selectGroup(b)}>Select</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {group && (
            <div className="card" style={{marginBottom:20}}>
              <div className="section-label" style={{marginTop:0}}>Checking in {group.length} {group.length===1 ? "person" : "people"}</div>
              {group.length === 0 && <p style={{color:"var(--muted)",fontSize:13}}>Everyone's been removed — cancel, or search/scan again.</p>}
              {group.map(b => (
                <div key={b.BookingID} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid var(--border)"}}>
                  <div>
                    <strong>{b.Name}</strong>
                    <div style={{color:"var(--muted)",fontSize:12}}>{b.MemberID || "Guest"}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <MealBadge meal={b.Meal} />
                    <button
                      className="icon-btn"
                      style={{color:"var(--plum)",fontSize:16,padding:"2px 4px"}}
                      title={"Remove " + b.Name + " (not attending)"}
                      onClick={()=>setGroup(group.filter(x => x.BookingID !== b.BookingID))}
                    >&#10005;</button>
                  </div>
                </div>
              ))}
              <div style={{display:"flex",gap:8,marginTop:14}}>
                <button className="btn ghost" onClick={()=>setGroup(null)}>Cancel</button>
                <button className="btn gold" style={{flex:1}} onClick={checkInGroupNow} disabled={checkingIn || group.length===0}>
                  {checkingIn ? "Checking in\u2026" : "Check In All"}
                </button>
              </div>
            </div>
          )}

          <div className="section-label">Recent check-ins</div>
          {recent.length === 0 ? <EmptyRow text="No check-ins yet for this event" /> : (
            <div className="list-card">
              <table>
                <tbody>
                  {recent.map((c,i) => (
                    <tr key={i}><td>{c.Name}</td><td style={{color:"var(--muted)",fontSize:12}}>{new Date(c.Timestamp).toLocaleTimeString()}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function Reports({ token }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState("");
  const [events, setEvents] = useState(null);
  const [selectedEventId, setSelectedEventId] = useState("");
  const [meal, setMeal] = useState(null);
  const [mealError, setMealError] = useState("");
  const [fyYear, setFyYear] = useState(() => {
    const now = new Date();
    // NZ financial year runs Apr–Mar; if we're Jan–Mar, we're still in last year's FY
    return now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1;
  });
  const [attendance, setAttendance] = useState(null);
  const [attendanceError, setAttendanceError] = useState("");
  const canvasRef1 = useRef(null);
  const canvasRef2 = useRef(null);
  const chartRefs = useRef([]);

  useEffect(() => {
    api("dashboardSummary", {}, token).then(r => setData(r.data)).catch(e => setError(e.message));
    api("listEvents", {}, token).then(r => setEvents(r.data)).catch(()=>{});
  }, [token]);

  useEffect(() => {
    if (!selectedEventId) { setMeal(null); return; }
    setMealError("");
    api("mealReport", { eventId: selectedEventId }, token).then(r => setMeal(r.data)).catch(e => setMealError(e.message));
  }, [selectedEventId, token]);

  useEffect(() => {
    setAttendanceError("");
    api("attendanceReport", { fyStartYear: fyYear }, token).then(r => setAttendance(r.data)).catch(e => setAttendanceError(e.message));
  }, [fyYear, token]);

  useEffect(() => {
    if (!data) return;
    chartRefs.current.forEach(c => c && c.destroy());
    chartRefs.current = [];
    if (canvasRef1.current) {
      const c1 = new Chart(canvasRef1.current, {
        type: "bar",
        data: { labels: ["Members","Events","Bookings","Volunteers"],
          datasets: [{ label:"Count", data:[data.memberCount, data.upcomingEventsCount, data.bookingCount, data.volunteerCount], backgroundColor:"#dfa53a" }] },
        options: { plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
      });
      chartRefs.current.push(c1);
    }
    if (canvasRef2.current) {
      const byMethod = {};
      (data.recentPayments||[]).forEach(p => { byMethod[p.Method] = (byMethod[p.Method]||0) + (parseFloat(p.Amount)||0); });
      const c2 = new Chart(canvasRef2.current, {
        type: "doughnut",
        data: { labels: Object.keys(byMethod).length ? Object.keys(byMethod) : ["No data"],
          datasets: [{ data: Object.keys(byMethod).length ? Object.values(byMethod) : [1], backgroundColor:["#0d332e","#dfa53a","#3f7a52","#7a2e46","#66756e"] }] }
      });
      chartRefs.current.push(c2);
    }
  }, [data]);

  if (error) return <ApiErrorPanel message={error} />;
  if (!data) return <LoadingPanel />;

  const GROUP_LABELS = { adultMember: "Member (12+)", childMember: "Member (under 12)", adultGuest: "Guest (12+)", childGuest: "Guest (under 12)" };

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <h3 style={{marginTop:0}}>Catering / meal report</h3>
        <p style={{color:"var(--muted)",fontSize:12.5,marginTop:-6}}>Pick an event to see exactly how many Standard, Jain, and No Meal to prepare — broken down by member vs. guest, adult vs. child.</p>
        <div className="field" style={{marginBottom: selectedEventId ? 16 : 0}}>
          <label>Event</label>
          <select value={selectedEventId} onChange={e=>setSelectedEventId(e.target.value)}>
            <option value="">Choose an event…</option>
            {(events||[]).map(e => <option key={e.EventID} value={e.EventID}>{e.Name} ({e.EventID})</option>)}
          </select>
        </div>
        {mealError && <div className="error-msg">{mealError}</div>}
        {selectedEventId && !meal && !mealError && <div style={{color:"var(--muted)",fontSize:13}}>Loading…</div>}
        {meal && (
          <div className="scroll-x">
            <table>
              <thead><tr><th></th><th>Standard</th><th>Jain</th><th>No Meal</th><th>Total</th></tr></thead>
              <tbody>
                {Object.keys(GROUP_LABELS).map(g => (
                  <tr key={g}>
                    <td>{GROUP_LABELS[g]}</td>
                    <td>{meal.groups[g].Standard}</td>
                    <td>{meal.groups[g].Jain}</td>
                    <td>{meal.groups[g]["No Meal"]}</td>
                    <td style={{fontWeight:700}}>{meal.groups[g].total}</td>
                  </tr>
                ))}
                <tr style={{borderTop:"2px solid var(--border)"}}>
                  <td style={{fontWeight:700}}>Grand total</td>
                  <td style={{fontWeight:700}}>{meal.grandTotal.Standard}</td>
                  <td style={{fontWeight:700}}>{meal.grandTotal.Jain}</td>
                  <td style={{fontWeight:700}}>{meal.grandTotal["No Meal"]}</td>
                  <td style={{fontWeight:700}}>{meal.grandTotal.total}</td>
                </tr>
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card" style={{marginBottom:16}}>
        <h3 style={{marginTop:0}}>Attendance frequency</h3>
        <p style={{color:"var(--muted)",fontSize:12.5,marginTop:-6}}>How many events each person checked into within a financial year (NZ default: 1 April – 31 March).</p>
        <div className="field" style={{marginBottom:16}}>
          <label>Financial year</label>
          <select value={fyYear} onChange={e=>setFyYear(parseInt(e.target.value,10))}>
            {[0,1,2,3,4].map(i => {
              const y = new Date().getFullYear() - i;
              return <option key={y} value={y}>{y} – {y+1}</option>;
            })}
          </select>
        </div>
        {attendanceError && <div className="error-msg">{attendanceError}</div>}
        {!attendance && !attendanceError && <div style={{color:"var(--muted)",fontSize:13}}>Loading…</div>}
        {attendance && (
          attendance.length === 0 ? <EmptyRow text="No check-ins recorded for this financial year" /> : (
            <div className="scroll-x">
              <table>
                <thead><tr><th>Name</th><th>Member ID</th><th>Times attended</th></tr></thead>
                <tbody>
                  {attendance.map((a,i) => (
                    <tr key={i}>
                      <td>{a.Name}{a.isGuest && <span style={{color:"var(--muted)",fontSize:11.5}}> (Guest)</span>}</td>
                      <td>{a.MemberID || "—"}</td>
                      <td style={{fontWeight:700}}>{a.count}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )
        )}
      </div>

      <div className="card" style={{marginBottom:16}}><h3 style={{marginTop:0}}>Activity overview</h3><canvas ref={canvasRef1} height="200"></canvas></div>
      <div className="card"><h3 style={{marginTop:0}}>Recent payments by method</h3><canvas ref={canvasRef2} height="200"></canvas></div>
    </div>
  );
}

function Volunteers({ token }) {

  const [search, setSearch] = useState("");
  const [editing, setEditing] = useState(null);

  const load = useCallback(() => {
    api("listVolunteers", {}, token).then(r => setRows(r.data)).catch(e => setError(e.message));
  }, [token]);
  useEffect(load, [load]);

  const filtered = useMemo(() => {
    if (!rows) return [];
    const q = search.toLowerCase();
    return rows.filter(r => (r.Name||"").toLowerCase().includes(q) || (r.Skills||"").toLowerCase().includes(q));
  }, [rows, search]);

  const save = async (record) => { await api("saveVolunteer", { record: JSON.stringify(record) }, token); setEditing(null); load(); };
  const remove = async (id) => { if (!confirm("Remove this volunteer?")) return; await api("deleteVolunteer", { id }, token); load(); };

  if (error) return <ApiErrorPanel message={error} />;
  if (!rows) return <LoadingPanel />;

  return (
    <div>
      <div className="toolbar">
        <input type="search" placeholder="Search by name or skill…" value={search} onChange={e=>setSearch(e.target.value)} />
        <button className="btn gold" onClick={()=>setEditing({})}>+ Add volunteer</button>

      <div className="list-card"><div className="scroll-x">
        {filtered.length === 0 ? <EmptyRow text="No volunteers found" /> : (
          <table>

                <tr key={v.VolunteerID}>

                  <td>{v.Skills}</td>
                  <td><StatusBadge status={v.Status} /></td>
                  <td style={{whiteSpace:"nowrap"}}>

              ))}

          </table>
        )}
      </div></div>
      {editing !== null && <VolunteerModal record={editing} onClose={()=>setEditing(null)} onSave={save} />}

function Settings({ token, user }) {

  const [users, setUsers] = useState(null);
  const [error, setError] = useState("");
  const isAdmin = user.role === "admin";

  useEffect(() => {

    if (isAdmin) api("listUsers", {}, token).then(r => setUsers(r.data)).catch(()=>{});
  }, [token]);

  const saveOne = async (key, value) => { await api("saveSetting", { key, value }, token); setSettings({ ...settings, [key]: value }); };

  if (error) return <ApiErrorPanel message={error} />;
  if (!settings) return <LoadingPanel />;

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <h3 style={{marginTop:0}}>Organization</h3>
        <SettingField label="Organization name" value={settings.orgName || ""} onSave={v=>saveOne("orgName", v)} />
        <SettingField label="Contact email" value={settings.contactEmail || ""} onSave={v=>saveOne("contactEmail", v)} />
        <SettingField label="Annual member fee ($)" value={settings.annualFee || ""} onSave={v=>saveOne("annualFee", v)} />
      </div>
      <div className="card">
        <h3 style={{marginTop:0}}>Your account</h3>
        <p style={{color:"var(--muted)",fontSize:14}}>Signed in as <strong>{user.name}</strong> ({user.email})</p>
        <p style={{color:"var(--muted)",fontSize:13}}>Role: <span className="badge ok">{user.role}</span></p>
        {isAdmin && (
          <div style={{marginTop:16}}>
            <h4 style={{marginBottom:8}}>Committee users</h4>
            {!users ? <div style={{color:"var(--muted)",fontSize:13}}>Loading…</div> : (
              <div className="scroll-x"><table>
                <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
                <tbody>{users.map((u,i) => <tr key={i}><td>{u.Name}</td><td>{u.Email}</td><td>{u.Role}</td></tr>)}</tbody>
              </table></div>
            )}
            <p style={{fontSize:12,color:"var(--muted)",marginTop:10}}>To add users, add a row to the <code>Users</code> sheet, or call <code>saveUser</code> with a <code>Password</code> field.</p>
          </div>
        )}
      </div>
    </div>
  );
}

function SettingField({ label, value, onSave }) {
  const [val, setVal] = useState(value);
  const [saved, setSaved] = useState(false);
  useEffect(() => setVal(value), [value]);
  return (
    <div className="field">
      <label>{label}</label>
      <div style={{display:"flex", gap:8}}>
        <input value={val} onChange={e=>{setVal(e.target.value); setSaved(false);}} />
        <button className="btn ghost" style={{whiteSpace:"nowrap"}} onClick={async ()=>{ await onSave(val); setSaved(true); }}>
          {saved ? "Saved" : "Save"}
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */
function App() {
  const [session, setSession] = useState(null);
  if (!session) return <Login onLogin={(token, user) => setSession({ token, user })} />;
  return <Shell user={session.user} token={session.token} onLogout={() => setSession(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
